<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doctors Club</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1E9D2;--ink:#2a1c1c;--mute:#7d7468;--line:#b3aa9b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#211e1a;--ink:#efe8db;--mute:#a39a8b;--line:#4a443b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#211e1a;--ink:#efe8db;--mute:#a39a8b;--line:#4a443b;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:center;gap:clamp(14px,4vw,40px);padding:16px 12px;flex-wrap:wrap}
header a{color:var(--ink);text-decoration:none;letter-spacing:.22em;font-size:14px;text-transform:uppercase;opacity:.75}
header a:hover{opacity:1;border-bottom:1px solid var(--ink)}
.hero{position:relative;overflow:hidden;min-height:calc(100vh - 56px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px 20px}
.leaf{position:absolute;width:clamp(150px,30vw,340px);color:var(--ink);pointer-events:none}
.tl{top:0;left:0}.hero>:not(.leaf){position:relative;z-index:1}.br{bottom:0;right:0;transform:rotate(180deg)}
.hero h1{margin:0;font-weight:300;font-size:clamp(40px,10vw,104px);letter-spacing:.14em;line-height:1.1;text-transform:uppercase}
.hero .sub{margin-top:34px;letter-spacing:.5em;font-size:16px;color:var(--mute)}
.hero .ar{margin-top:10px;font-size:20px}
.hero .go{margin-top:44px;color:var(--ink);text-decoration:none;border:1px solid var(--ink);padding:10px 30px;letter-spacing:.3em;font-size:13px}
.seal{margin-top:40px;width:84px;height:84px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:14px;line-height:1.1;padding-top:2px}
section.big{max-width:680px;margin:0 auto;padding:70px 22px 20px;text-align:center}
section.big>h2{margin:0;font-weight:300;font-size:clamp(34px,8vw,58px);letter-spacing:.2em;text-transform:uppercase}
.chips{margin:14px 0 6px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px}
.chips a{color:var(--mute);text-decoration:none;font-size:15px}
.cat{margin-top:34px;border:1.5px dashed var(--ink);padding:24px 20px 14px}
.cat h3{margin:0;font-weight:400;letter-spacing:.35em;font-size:16px;text-transform:uppercase}
.cat .l{margin:6px auto 14px;width:40px;border-top:1px solid var(--ink)}
.cat-photo{position:relative;margin:14px 0 18px;width:100%;height:clamp(160px,32vw,220px);overflow:hidden;border:1px solid var(--ink);background:rgba(179,170,155,.18)}
.cat-photo::after{content:"";position:absolute;inset:6px;border:1px solid rgba(255,255,255,.7);pointer-events:none;transition:inset .4s ease,border-color .4s ease;z-index:2}
.cat-photo img{width:100%;height:100%;object-fit:cover;display:block;filter:sepia(8%) contrast(102%) brightness(98%);transition:transform .7s cubic-bezier(.2,0,.2,1),filter .5s ease}
.cat:hover .cat-photo img{transform:scale(1.035);filter:sepia(4%) contrast(105%) brightness(100%)}
.cat:hover .cat-photo::after{inset:8px;border-color:rgba(255,255,255,.95)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cat-photo::after{border-color:rgba(239,232,219,.35)}:root:not([data-theme="light"]) .cat-photo img{filter:sepia(6%) contrast(102%) brightness(90%)}:root:not([data-theme="light"]) .cat:hover .cat-photo::after{border-color:rgba(239,232,219,.55)}:root:not([data-theme="light"]) .cat:hover .cat-photo img{filter:sepia(3%) contrast(105%) brightness(96%)}}
:root[data-theme="dark"] .cat-photo::after{border-color:rgba(239,232,219,.35)}
:root[data-theme="dark"] .cat-photo img{filter:sepia(6%) contrast(102%) brightness(90%)}
:root[data-theme="dark"] .cat:hover .cat-photo::after{border-color:rgba(239,232,219,.55)}
:root[data-theme="dark"] .cat:hover .cat-photo img{filter:sepia(3%) contrast(105%) brightness(96%)}
.it{display:flex;align-items:flex-end;gap:8px;padding:6px 0;font-size:17px;text-align:start}
.it span small{display:block;font-size:13px;line-height:1.35;color:var(--mute);font-weight:400}
.it u{flex:1;border-bottom:1px dotted var(--line);margin-bottom:7px;min-width:12px}
.pr{display:flex;gap:12px;direction:ltr}
.pr i{display:flex;flex-direction:column;align-items:center;font-weight:600;font-style:normal;min-width:30px;font-size:17px}
.pr small{font-size:11px;letter-spacing:.15em;color:var(--mute);line-height:1.1}
footer{text-align:center;color:var(--mute);font-size:14px;letter-spacing:.15em;padding:60px 16px 40px}
/* Arabic letters must stay connected: no letter-spacing on Arabic text */
header a{letter-spacing:.12em;font-weight:500;opacity:.85}
section.big>h2{font-weight:600;letter-spacing:.14em}
.hero h1{font-weight:600;letter-spacing:.1em}
.cat h3{font-weight:700;letter-spacing:0;font-size:23px;text-transform:none}
.chips a{font-weight:500;letter-spacing:0}
.it{font-weight:500}
.it span small{font-weight:400;line-height:1.5}
.hero .ar,.hero .sub{font-weight:500}
footer{letter-spacing:0;font-weight:500}
.odd{display:flex;flex-direction:column;align-items:center;gap:10px;margin:34px auto 0;color:var(--ink);text-decoration:none;letter-spacing:0;direction:ltr}
.odd-rule{display:flex;align-items:center;gap:12px;width:min(220px,60vw);opacity:.6}
.odd-rule i{flex:1;border-top:1px solid var(--ink)}
.odd-rule b{font-size:8px;font-weight:400}
.odd-by{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:15px;letter-spacing:.12em;color:var(--mute)}

const S=[["food","الأكل","Food"],["drinks","المشروبات","Drinks"],["sweets","الحلويات","Desserts"]],K=Object.keys(D);
function branch(){let s='<path d="M5 295C60 200 120 130 285 40"/>';for(let i=1;i<=9;i++){const t=i/10,x=5+280*t,y=295-255*t+Math.sin(t*3)*20,sd=i%2?1:-1;s+=`<g transform="translate(${x} ${y}) rotate(${-40-i*4+sd*50}) scale(${1.4-i*.07})"><path d="M0 0C10-14 30-14 42 0C30 14 10 14 0 0Z"/><path d="M4 0H36"/></g>`}return`<svg viewBox="0 0 300 300" fill="none" stroke="currentColor" stroke-width="1.3">${s}</svg>`}
l1.innerHTML=l2.innerHTML=branch();
nav.innerHTML=[["home","","Home"]].concat(S).map(x=>`<a href="#${x[0]}">${x[2]}</a>`).join("");
let n=0;
m.innerHTML=K.map((k,si)=>{const cs=D[k];const ids=cs.map(()=>"c"+n++);n-=cs.length;
return`<section class="big" id="${S[si][0]}"><h2>${S[si][2]}</h2><div class="chips">${cs.map((c,i)=>`<a href="#c${n+i}">${c[0]}</a>`).join("")}</div>`+
cs.map(([t,l,items],i)=>{const ls=l.split(" / ");const img=CAT_IMAGES[t];const photo=img?`<div class="cat-photo"><img src="${img}" alt="${t}" loading="lazy" decoding="async" onerror="if(this.src.indexOf('images/')===-1&&this.src.indexOf('://')===-1){this.src='images/'+this.src}else if(this.src.indexOf('images/')!==-1){this.parentElement.style.display='none'}else{var f=this.src.split('/').pop().split('?')[0];if(f){this.src='images/'+f}else{this.parentElement.style.display='none'}}"></div>`:"";return`<div class="cat" id="c${n+i}"><h3>${t}</h3><div class="l"></div>${photo}${items.map(it=>{const[nm,p,d]=it.split("|"),v=p.split("/");return`<div class="it"><span>${nm}${d?`<small>${d}</small>`:""}</span><u></u><div class="pr">${v.map((x,j)=>`<i>${v.length>1&&ls[j]?`<small>${ls[j]}</small>`:""}${x}</i>`).join("")}</div></div>`}).join("")}</div>`}).join("")+"</section>"+(n+=cs.length,"")}).join("");
